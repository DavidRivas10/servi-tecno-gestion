name: Hotfix render

on:
  push:
    paths:
      - '.github/workflows/hotfix-render.yml'

permissions:
  contents: write

jobs:
  fix-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix table renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "rows.join('')"
          new = "(Array.isArray(rows)?rows.join(''):rows)"
          if old not in s:
              raise SystemExit('Target pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Hotfix render navigation and repairs table"
          git push
