<!doctype html>

<head>

<style>
:root{--bg:#f4f7fb;--panel:#fff;--nav:#0b1220;--nav2:#111a2b;--primary:#1565d8;--primary2:#0b4ca8;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--good:#059669;--warn:#d97706;--bad:#dc2626;--shadow:0 10px 28px rgba(15,23,42,.07);--radius:17px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.side{background:linear-gradient(180deg,var(--nav),var(--nav2));color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:4px 3px 16px;border-bottom:1px solid #ffffff18}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#2f83ff,#1461cc);display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand small{color:#96a4ba}.nav{display:flex;flex-direction:column;gap:6px;flex:1}.nav button{border:0;background:transparent;color:#b9c5d6;padding:11px 12px;border-radius:11px;text-align:left;font-weight:750}.nav button:hover,.nav button.active{background:#2b77e833;color:#fff}.sideActions{display:grid;gap:8px}.sideBtn{border:1px solid #ffffff24;background:transparent;color:#e5edf8;padding:9px 10px;border-radius:10px}.main{padding:24px 28px 48px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px}.ey{font-size:11px;color:var(--primary);font-weight:900;letter-spacing:.14em}.top h1{margin:3px 0 0;font-size:28px;letter-spacing:-.03em}.topActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.datePill{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--muted);font-size:12px}.btn,.btn2,.btn3,.danger{border:0;border-radius:10px;padding:10px 13px;font-weight:800}.btn{background:var(--primary);color:#fff}.btn:hover{background:var(--primary2)}.btn2{background:#eaf2ff;color:var(--primary)}.btn3{background:#f1f5f9;color:#334155}.danger{background:#fee2e2;color:#b91c1c}.view{display:none}.view.active{display:block}.grid{display:grid;gap:14px}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.k small{color:var(--muted);font-size:12px}.k b{display:block;font-size:25px;margin:8px 0 5px;letter-spacing:-.03em}.k .sub{font-size:12px;color:var(--muted)}.sec{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 10px}.sec h2{margin:0;font-size:18px}.sec p{margin:3px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:13px 15px;border-radius:13px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;font-size:13px}.notice.good{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.notice.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}.tbl{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:12.5px;vertical-align:middle}th{background:#f8fafc;color:#475569;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.goodtxt{color:var(--good);font-weight:800}.warntxt{color:var(--warn);font-weight:800}.badtxt{color:var(--bad);font-weight:800}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10.5px;font-weight:800;white-space:nowrap}.b-blue{background:#dbeafe;color:#1d4ed8}.b-green{background:#dcfce7;color:#047857}.b-yellow{background:#fef3c7;color:#a16207}.b-red{background:#fee2e2;color:#b91c1c}.b-gray{background:#e2e8f0;color:#475569}.status{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;font-size:11px}.teamGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.person{display:flex;gap:11px;align-items:flex-start}.avatar{width:44px;height:44px;border-radius:13px;background:#eaf2ff;color:var(--primary);display:grid;place-items:center;font-weight:900;flex:none}.sum{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}.sum:last-child{border-bottom:0}.cashHero{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.state{display:flex;justify-content:space-between;align-items:center;gap:15px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px}.open{background:#10b981}.closed{background:#94a3b8}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;color:#475569;padding:8px 11px;border-radius:9px;font-weight:750}.tab.active{background:#eaf2ff;color:var(--primary);border-color:#cfe0ff}.modalbg{position:fixed;inset:0;background:#020617a6;display:none;place-items:center;padding:18px;z-index:100}.modalbg.open{display:grid}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:19px;padding:21px;box-shadow:0 30px 90px #0004}.mh{display:flex;justify-content:space-between;gap:15px}.mh h2{margin:4px 0 17px}.x{border:0;background:#eef2f7;width:35px;height:35px;border-radius:10px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.f{display:flex;flex-direction:column;gap:6px}.f.full{grid-column:1/-1}.f label{font-size:12px;color:#475569;font-weight:750}.f input,.f select,.f textarea{border:1px solid var(--line);padding:10px 11px;border-radius:9px;outline:none;background:#fff}.f textarea{min-height:78px;resize:vertical}.fa{display:flex;justify-content:flex-end;gap:8px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:1250px){.g6{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(3,1fr)}.teamGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.sideActions{grid-template-columns:1fr 1fr}.main{padding:20px 15px 40px}.top{flex-direction:column}.g6,.g5,.g4,.g3,.g2,.cashHero{grid-template-columns:1fr}.teamGrid{grid-template-columns:1fr}}@media(max-width:600px){.nav{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.f.full{grid-column:auto}.datePill{display:none}}@media print{.side,.topActions,.actions{display:none!important}.app{display:block}.main{padding:0}.view{display:none!important}#reports.view.active{display:block!important}.card,.tbl{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">ST</div><div><b>SERVI TECNO</b><small>Gestión diaria</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sideActions"><button class="sideBtn" onclick="exportData()">Exportar respaldo</button><button class="sideBtn" onclick="document.querySelector('#importFile').click()">Importar respaldo</button></div>
  </aside>
  <main class="main">
    <header class="top"><div><div class="ey">SERVI TECNO</div><h1 id="title">Dashboard</h1></div><div class="topActions"><div class="datePill" id="dateLabel"></div><button class="btn2" onclick="openForm('repair')">+ Reparación</button><button class="btn" onclick="openForm('sale')">+ Venta</button></div></header>
    <div id="views"></div>
  </main>
</div>
<div class="modalbg" id="modal"><div class="modal"><div class="mh"><div><div class="ey">SERVI TECNO</div><h2 id="modalTitle"></h2></div><button class="x" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<input type="file" id="importFile" accept="application/json" hidden>
<script>
const STORE='servitecno_v5_clean_20260814';
const money=new Intl.NumberFormat('es-HN',{style:'currency',currency:'HNL',maximumFractionDigits:2});
const n=v=>Number(v||0);
const localISO=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=localISO();
const now=()=>new Date().toISOString();
const uid=p=>p+Math.random().toString(36).slice(2,9);
const seed={version:5,settings:{producerPct:60,businessPct:40,reservePct:15,lowStock:3},staff:[
{id:'david',name:'David',role:'Ventas de teléfonos, computadoras, accesorios y administración',type:'sales'},
{id:'roberto',name:'Roberto',role:'Técnico de teléfonos',type:'technician'},
{id:'tico',name:'Tico',role:'Técnico de teléfonos',type:'technician'}
],products:[],sales:[],repairs:[],expenses:[],cashSessions:[]};
function load(){try{return JSON.parse(localStorage.getItem(STORE))||structuredClone(seed)}catch{return structuredClone(seed)}}
let db=load();
function save(){localStorage.setItem(STORE,JSON.stringify(db));render()}
const staffName=id=>db.staff.find(x=>x.id===id)?.name||'—';
const productName=id=>db.products.find(x=>x.id===id)?.name||'Producto';
const inRange=(d,a,b)=>d>=a&&d<=b;
function weekRange(d=today){let x=new Date(d+'T12:00:00'),day=x.getDay()||7;x.setDate(x.getDate()-day+1);const a=localISO(x);x.setDate(x.getDate()+6);return[a,localISO(x)]}
function monthRange(d=today){const x=new Date(d+'T12:00:00');return[`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-01`,`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(new Date(x.getFullYear(),x.getMonth()+1,0).getDate()).padStart(2,'0')}`]}
function share(margin,pct){return Math.max(0,margin)*pct/100}
function saleMargin(s){return n(s.total)-n(s.costTotal)}
function repairMargin(r){return n(r.total)-n(r.partsCost)}
function repairDone(r){return ['Listo','Entregado'].includes(r.status)}
function repairPaid(r){return (r.payments||[]).reduce((t,p)=>t+n(p.amount),0)}
function repairBalance(r){return Math.max(0,n(r.total)-repairPaid(r))}
function currentCash(date=today){return db.cashSessions.find(x=>x.date===date)||null}
function cashExpected(date=today){const c=currentCash(date);if(!c)return 0;const sales=db.sales.filter(x=>x.date===date&&x.payment==='Efectivo').reduce((t,x)=>t+n(x.total),0);const repairs=db.repairs.flatMap(r=>(r.payments||[]).filter(p=>p.date===date&&p.method==='Efectivo')).reduce((t,p)=>t+n(p.amount),0);const expenses=db.expenses.filter(x=>x.date===date&&x.payment==='Efectivo').reduce((t,x)=>t+n(x.amount),0);return n(c.opening)+sales+repairs-expenses}
function calc(a,b){const sales=db.sales.filter(x=>inRange(x.date,a,b));const repairsCreated=db.repairs.filter(x=>inRange(x.date,a,b));const repairsDone=db.repairs.filter(x=>repairDone(x)&&inRange(x.doneDate||x.date,a,b));const expenses=db.expenses.filter(x=>inRange(x.date,a,b));const salesRevenue=sales.reduce((t,x)=>t+n(x.total),0);const salesMarginTotal=sales.reduce((t,x)=>t+saleMargin(x),0);const repairRevenue=repairsDone.reduce((t,x)=>t+n(x.total),0);const repairMarginTotal=repairsDone.reduce((t,x)=>t+repairMargin(x),0);const repairCollected=db.repairs.flatMap(r=>(r.payments||[]).filter(p=>inRange(p.date,a,b))).reduce((t,p)=>t+n(p.amount),0);const expensesTotal=expenses.reduce((t,x)=>t+n(x.amount),0);const businessGross=share(salesMarginTotal+repairMarginTotal,db.settings.businessPct);const businessNet=businessGross-expensesTotal;const reserve=Math.max(0,businessNet)*db.settings.reservePct/100;return{sales,repairsCreated,repairsDone,expenses,salesRevenue,salesMarginTotal,repairRevenue,repairMarginTotal,repairCollected,expensesTotal,businessGross,businessNet,reserve,availableBusiness:businessNet-reserve}}
function staffShares(a,b){const out=Object.fromEntries(db.staff.map(s=>[s.id,0]));db.sales.filter(x=>inRange(x.date,a,b)).forEach(s=>out[s.seller]=(out[s.seller]||0)+share(saleMargin(s),db.settings.producerPct));db.repairs.filter(r=>repairDone(r)&&inRange(r.doneDate||r.date,a,b)).forEach(r=>out[r.tech]=(out[r.tech]||0)+share(repairMargin(r),db.settings.producerPct));return out}
function receivables(){return db.repairs.filter(repairDone).reduce((t,r)=>t+repairBalance(r),0)}
function alerts(){const a=[];db.repairs.forEach(r=>{if(r.status==='Listo')a.push(`Orden ${r.order}: lista para entregar`);if(repairDone(r)&&repairBalance(r)>0)a.push(`Orden ${r.order}: saldo ${money.format(repairBalance(r))}`)});db.products.filter(p=>p.stock<=n(p.minStock??db.settings.lowStock)).forEach(p=>a.push(`Stock bajo: ${p.name} (${p.stock})`));if(!currentCash())a.unshift('Caja de hoy sin abrir');return a}
const pages=[['dashboard','Dashboard'],['cash','Caja'],['sales','Ventas'],['repairs','Reparaciones'],['inventory','Inventario'],['expenses','Gastos'],['reports','Reportes'],['team','Equipo'],['settings','Configuración']];
document.querySelector('#views').innerHTML=pages.map((p,i)=>`<section id="${p[0]}" class="view ${i?'':'active'}"></section>`).join('');
function navRender(){document.querySelector('#nav').innerHTML=pages.map(p=>`<button class="${document.querySelector('#'+p[0])?.classList.contains('active')?'active':''}" onclick="go('${p[0]}',this)">${p[1]}</button>`).join('')}
function go(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelector('#'+id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');document.querySelector('#title').textContent=pages.find(x=>x[0]===id)[1];render()}
document.querySelector('#dateLabel').textContent=new Intl.DateTimeFormat('es-HN',{dateStyle:'full'}).format(new Date());
const kpi=(l,v,s='')=>`<div class="card k"><small>${l}</small><b>${v}</b><div class="sub">${s}</div></div>`;
const section=(t,d,b='')=>`<div class="sec"><div><h2>${t}</h2><p>${d}</p></div><div class="actions">${b}</div></div>`;
function table(h,r){if(!r.length)return `<div class="card empty">Sin registros todavía.</div>`;return `<div class="tbl"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.join('')}</tbody></table></div>`}
function statusBadge(s){const cls=s==='Entregado'?'b-gray':s==='Listo'?'b-green':s==='Cancelado'?'b-red':'b-blue';return `<span class="badge ${cls}">${s}</span>`}
function paymentBadge(p){return `<span class="badge ${p==='Efectivo'?'b-green':'b-blue'}">${p}</span>`}
function renderDashboard(){const d=calc(today,today),sh=staffShares(today,today),a=alerts(),c=currentCash();document.querySelector('#dashboard').innerHTML=`<div class="grid g6">${kpi('Ventas de hoy',money.format(d.salesRevenue),`${d.sales.length} ventas`)}${kpi('Reparaciones registradas',d.repairsCreated.length,`${money.format(d.repairsCreated.reduce((t,r)=>t+n(r.total),0))} en órdenes`)}${kpi('Reparaciones terminadas',money.format(d.repairRevenue),`${d.repairsDone.length} listas/entregadas`)}${kpi('Gastos de hoy',money.format(d.expensesTotal),'Egresos')}${kpi('Por cobrar',money.format(receivables()),'Reparaciones terminadas')}${kpi('Caja',c?(c.status==='open'?'ABIERTA':'CERRADA'):'SIN ABRIR',c?`Esperado ${money.format(cashExpected())}`:'Requiere apertura')}</div>${section('Ganancia de hoy','60% para quien produjo · 40% para Servi Tecno')}<div class="teamGrid">${db.staff.map(s=>`<div class="card person"><div class="avatar">${s.name.slice(0,2).toUpperCase()}</div><div><b>${s.name}</b><div class="muted">${s.role}</div><h3>${money.format(sh[s.id]||0)}</h3><small>Su 60% del margen</small></div></div>`).join('')}<div class="card person"><div class="avatar">ST</div><div><b>Servi Tecno</b><div class="muted">Fondo del negocio</div><h3>${money.format(d.businessGross)}</h3><small>40% del margen, antes de gastos</small></div></div></div>${section('Pendientes','Lo que requiere atención')}<div class="card">${a.length?a.map(x=>`<div class="sum"><span>${x}</span><span class="badge b-yellow">Pendiente</span></div>`).join(''):'<div class="notice good">No hay pendientes.</div>'}</div>`}
function renderCash(){const c=currentCash(),expected=c?cashExpected():0;document.querySelector('#cash').innerHTML=`<div class="cashHero"><div class="card"><div class="state"><div><small class="muted">CAJA DE HOY</small><h2>${c?`<span class="dot ${c.status==='open'?'open':'closed'}"></span>${c.status==='open'?'Abierta':'Cerrada'}`:'Sin abrir'}</h2><div class="muted">${c?`Apertura ${money.format(c.opening)}`:'Registra el efectivo inicial.'}</div></div>${!c?'<button class="btn" onclick="openForm(\'openCash\')">Abrir caja</button>':c.status==='open'?'<button class="btn" onclick="openForm(\'closeCash\')">Cerrar caja</button>':'<span class="badge b-gray">Día cerrado</span>'}</div></div><div class="card"><small class="muted">EFECTIVO ESPERADO</small><h2>${money.format(expected)}</h2><div class="muted">Apertura + ventas en efectivo + cobros de reparaciones − gastos en efectivo.</div></div></div>${c&&c.status==='closed'?`<div class="grid g3" style="margin-top:14px">${kpi('Contado',money.format(c.closing),'Efectivo físico')}${kpi('Esperado',money.format(c.expectedAtClose),'Según movimientos')}${kpi('Diferencia',money.format(c.closing-c.expectedAtClose),(c.closing-c.expectedAtClose)===0?'Caja cuadrada':'Revisar')}</div>`:''}${section('Historial','Apertura y cierre por día')}${table(['Fecha','Estado','Apertura','Esperado','Contado','Diferencia','Responsable'],[...db.cashSessions].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${x.date}</td><td>${x.status==='open'?'<span class="badge b-green">Abierta</span>':'<span class="badge b-gray">Cerrada</span>'}</td><td>${money.format(x.opening)}</td><td>${x.status==='closed'?money.format(x.expectedAtClose):'—'}</td><td>${x.status==='closed'?money.format(x.closing):'—'}</td><td>${x.status==='closed'?money.format(x.closing-x.expectedAtClose):'—'}</td><td>${staffName(x.openedBy)}</td></tr>`))}`}
function renderSales(){document.querySelector('#sales').innerHTML=`${section('Ventas','Aquí se ve claramente el reparto del margen','<button class="btn" onclick="openForm(\'sale\')">+ Nueva venta</button>')}${table(['Fecha','Cliente','Producto','Total','Costo','Margen','David 60%','Servi Tecno 40%','Pago'],[...db.sales].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(s=>{const m=saleMargin(s);return `<tr><td>${s.date}</td><td>${s.client}</td><td>${productName(s.productId)}</td><td><b>${money.format(s.total)}</b></td><td>${money.format(s.costTotal)}</td><td class="goodtxt">${money.format(m)}</td><td><b>${money.format(share(m,db.settings.producerPct))}</b></td><td><b>${money.format(share(m,db.settings.businessPct))}</b></td><td>${paymentBadge(s.payment)}</td></tr>`}))}`}
function renderRepairs(){const states=['Recibido','En reparación','Listo','Entregado','Cancelado'];document.querySelector('#repairs').innerHTML=`${section('Reparaciones','Una orden pendiente se ve hoy; la comisión nace cuando queda Lista o Entregada','<button class="btn" onclick="openForm(\'repair\')">+ Nueva reparación</button>')}${table(['Orden','Fecha','Cliente','Equipo','Técnico','Total','Repuesto','Margen','Técnico 60%','Servi Tecno 40%','Saldo','Estado',''],[...db.repairs].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(r=>{const m=repairMargin(r),done=repairDone(r);return `<tr><td><b>${r.order}</b></td><td>${r.date}</td><td>${r.client}</td><td>${r.device}</td><td>${staffName(r.tech)}</td><td>${money.format(r.total)}</td><td>${money.format(r.partsCost)}</td><td class="${done?'goodtxt':'muted'}">${done?money.format(m):'Pendiente'}</td><td><b>${done?money.format(share(m,db.settings.producerPct)):'—'}</b></td><td><b>${done?money.format(share(m,db.settings.businessPct)):'—'}</b></td><td class="${repairBalance(r)>0?'warntxt':'goodtxt'}">${money.format(repairBalance(r))}</td><td><select class="status" onchange="changeRepairStatus('${r.id}',this.value)">${states.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn2" onclick="openRepair('${r.id}')">Gestionar</button></td></tr>`}))}<div class="notice" style="margin-top:14px"><strong>Regla:</strong> Recibido y En reparación no generan comisión todavía. Listo y Entregado sí generan el 60/40. Cancelado genera L0.</div>`}
function renderInventory(){const cost=db.products.reduce((t,p)=>t+n(p.cost)*n(p.stock),0),retail=db.products.reduce((t,p)=>t+n(p.price)*n(p.stock),0),low=db.products.filter(p=>p.stock<=n(p.minStock??db.settings.lowStock)).length;document.querySelector('#inventory').innerHTML=`<div class="grid g4">${kpi('Valor a costo',money.format(cost),'Capital en inventario')}${kpi('Valor a venta',money.format(retail),'Potencial')}${kpi('Productos',db.products.length,'SKUs')}${kpi('Stock bajo',low,'Reponer')}</div>${section('Inventario','Costo, precio y existencias','<button class="btn2" onclick="openForm(\'stock\')">+ Entrada / ajuste</button><button class="btn" onclick="openForm(\'product\')">+ Producto</button>')}${table(['SKU','Producto','Categoría','Costo','Precio','Stock','Mínimo'],db.products.map(p=>`<tr><td>${p.sku}</td><td><b>${p.name}</b></td><td>${p.category}</td><td>${money.format(p.cost)}</td><td>${money.format(p.price)}</td><td>${p.stock<=n(p.minStock)?`<span class="badge b-yellow">${p.stock}</span>`:p.stock}</td><td>${p.minStock}</td></tr>`))}`}
function renderExpenses(){document.querySelector('#expenses').innerHTML=`${section('Gastos','Todo egreso del negocio','<button class="btn" onclick="openForm(\'expense\')">+ Gasto</button>')}${table(['Fecha','Categoría','Descripción','Monto','Pago','Registró'],[...db.expenses].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(x=>`<tr><td>${x.date}</td><td>${x.category}</td><td>${x.description}</td><td class="badtxt">${money.format(x.amount)}</td><td>${paymentBadge(x.payment)}</td><td>${staffName(x.by)}</td></tr>`))}`}
let reportMode='week';function reportRange(){return reportMode==='day'?[today,today]:reportMode==='month'?monthRange():weekRange()}
function renderReports(){const[a,b]=reportRange(),r=calc(a,b),sh=staffShares(a,b);document.querySelector('#reports').innerHTML=`<div class="sec"><div><h2>Reportes</h2><p>${a} al ${b}</p></div><div class="actions"><div class="tabs"><button class="tab ${reportMode==='day'?'active':''}" onclick="reportMode='day';render()">Día</button><button class="tab ${reportMode==='week'?'active':''}" onclick="reportMode='week';render()">Semana</button><button class="tab ${reportMode==='month'?'active':''}" onclick="reportMode='month';render()">Mes</button></div><button class="btn2" onclick="print()">Imprimir / PDF</button></div></div><div class="grid g6">${kpi('Ventas',money.format(r.salesRevenue),'Productos')}${kpi('Reparaciones realizadas',money.format(r.repairRevenue),'Listas/entregadas')}${kpi('Cobrado reparaciones',money.format(r.repairCollected),'Pagos recibidos')}${kpi('Margen total',money.format(r.salesMarginTotal+r.repairMarginTotal),'Ventas + servicios')}${kpi('Gastos',money.format(r.expensesTotal),'Egresos')}${kpi('Fondo negocio neto',money.format(r.businessNet),'40% menos gastos')}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>60% de cada persona</h3>${db.staff.map(s=>`<div class="sum"><span><b>${s.name}</b><br><small class="muted">${s.role}</small></span><b>${money.format(sh[s.id]||0)}</b></div>`).join('')}</div><div class="card"><h3>Servi Tecno</h3><div class="sum"><span>40% generado</span><b>${money.format(r.businessGross)}</b></div><div class="sum"><span>− Gastos</span><b>${money.format(r.expensesTotal)}</b></div><div class="sum"><span>Fondo neto</span><b>${money.format(r.businessNet)}</b></div><div class="sum"><span>Reserva crecimiento ${db.settings.reservePct}%</span><b>${money.format(r.reserve)}</b></div><div class="sum"><span>Disponible operativo</span><b>${money.format(r.availableBusiness)}</b></div></div></div>`}
function renderTeam(){const[a,b]=weekRange(),sh=staffShares(a,b);document.querySelector('#team').innerHTML=`${section('Equipo','Participación semanal calculada con la misma regla 60/40')}<div class="teamGrid">${db.staff.map(s=>`<div class="card person"><div class="avatar">${s.name.slice(0,2).toUpperCase()}</div><div><b>${s.name}</b><div class="muted">${s.role}</div><h3>${money.format(sh[s.id]||0)}</h3><small>Su 60% semanal</small></div></div>`).join('')}</div>`}
function renderSettings(){document.querySelector('#settings').innerHTML=`${section('Configuración','Regla financiera del negocio')}<div class="card"><form class="form" onsubmit="saveSettings(event)"><div class="f"><label>% para quien produce</label><input name="producerPct" type="number" min="0" max="100" value="${db.settings.producerPct}"></div><div class="f"><label>% para Servi Tecno</label><input name="businessPct" type="number" min="0" max="100" value="${db.settings.businessPct}"></div><div class="f"><label>% reserva crecimiento</label><input name="reservePct" type="number" min="0" max="100" value="${db.settings.reservePct}"></div><div class="f"><label>Stock mínimo por defecto</label><input name="lowStock" type="number" min="0" value="${db.settings.lowStock}"></div><div class="f full"><div class="notice">Productor + Servi Tecno debe sumar 100%. Ejemplo: margen L1,000 → David/Roberto/Tico L600 y Servi Tecno L400.</div></div><div class="f full"><div class="fa"><button type="button" class="danger" onclick="resetAll()">Dejar todo en cero</button><button class="btn">Guardar</button></div></div></form></div>`}
function render(){try{renderDashboard()}catch(e){console.error('dashboard',e)}try{renderCash()}catch(e){console.error('cash',e)}try{renderSales()}catch(e){console.error('sales',e)}try{renderRepairs()}catch(e){console.error('repairs',e)}try{renderInventory()}catch(e){console.error('inventory',e)}try{renderExpenses()}catch(e){console.error('expenses',e)}try{renderReports()}catch(e){console.error('reports',e)}try{renderTeam()}catch(e){console.error('team',e)}try{renderSettings()}catch(e){console.error('settings',e)}navRender()}
function openModal(t,h){document.querySelector('#modalTitle').textContent=t;document.querySelector('#modalBody').innerHTML=h;document.querySelector('#modal').classList.add('open')}function closeModal(){document.querySelector('#modal').classList.remove('open');document.querySelector('#modalBody').innerHTML=''}document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});function staffOptions(filter=null,selected=''){return db.staff.filter(x=>!filter||x.type===filter).map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${x.name}</option>`).join('')}function payOptions(selected=''){return ['Efectivo','Transferencia','Tarjeta','Otro'].map(x=>`<option ${x===selected?'selected':''}>${x}</option>`).join('')}
function openForm(type){if(type==='openCash'){if(currentCash())return alert('La caja de hoy ya fue abierta.');return openModal('Abrir caja',`<form class="form" onsubmit="addOpenCash(event)"><div class="f"><label>Efectivo inicial</label><input name="opening" type="number" step=".01" min="0" value="0" required></div><div class="f"><label>Responsable</label><select name="by">${staffOptions()}</select></div><div class="f full"><div class="fa"><button class="btn">Abrir caja</button></div></div></form>`)}if(type==='closeCash'){const c=currentCash();if(!c||c.status!=='open')return alert('No hay caja abierta.');return openModal('Cerrar caja',`<form class="form" onsubmit="addCloseCash(event)"><div class="f"><label>Esperado</label><input value="${cashExpected().toFixed(2)}" disabled></div><div class="f"><label>Efectivo contado</label><input name="closing" type="number" step=".01" min="0" required></div><div class="f full"><div class="fa"><button class="btn">Cerrar caja</button></div></div></form>`)}if(type==='sale'){if(!db.products.length)return alert('Primero agrega un producto en Inventario.');const p=db.products[0];return openModal('Nueva venta',`<form class="form" onsubmit="addSale(event)"><div class="f"><label>Fecha</label><input name="date" type="date" value="${today}" required></div><div class="f"><label>Cliente</label><input name="client" value="Consumidor final"></div><div class="f full"><label>Producto</label><select name="productId" onchange="document.querySelector('#salePrice').value=db.products.find(p=>p.id===this.value).price">${db.products.map(x=>`<option value="${x.id}">${x.name} · stock ${x.stock}</option>`).join('')}</select></div><div class="f"><label>Cantidad</label><input name="qty" type="number" min="1" value="1" required></div><div class="f"><label>Precio unitario</label><input id="salePrice" name="price" type="number" step=".01" value="${p.price}" required></div><div class="f"><label>Forma de pago</label><select name="payment">${payOptions()}</select></div><div class="f"><label>Vendedor</label><select name="seller">${staffOptions('sales')}</select></div><div class="f full"><div class="notice">El costo se recupera primero. Solo el margen se divide 60/40.</div></div><div class="f full"><div class="fa"><button class="btn">Guardar venta</button></div></div></form>`)}if(type==='repair'){return openModal('Nueva reparación',`<form class="form" onsubmit="addRepair(event)"><div class="f"><label>Fecha</label><input name="date" type="date" value="${today}" required></div><div class="f"><label>Cliente</label><input name="client" required></div><div class="f"><label>Contacto</label><input name="phone"></div><div class="f"><label>Equipo / modelo</label><input name="device" required></div><div class="f full"><label>Falla / trabajo</label><textarea name="description" required></textarea></div><div class="f"><label>Técnico</label><select name="tech">${staffOptions('technician')}</select></div><div class="f"><label>Estado</label><select name="status"><option>Recibido</option><option>En reparación</option><option>Listo</option><option>Entregado</option></select></div><div class="f"><label>Precio del servicio</label><input name="total" type="number" step=".01" min="0" required></div><div class="f"><label>Costo de repuesto/material</label><input name="partsCost" type="number" step=".01" min="0" value="0" required></div><div class="f"><label>Pago recibido ahora</label><input name="paid" type="number" step=".01" min="0" value="0"></div><div class="f"><label>Forma de pago</label><select name="method">${payOptions()}</select></div><div class="f full"><div class="notice">Si ya terminó el trabajo, selecciona <strong>Listo</strong> o <strong>Entregado</strong>. Así entra inmediatamente a la producción del técnico.</div></div><div class="f full"><div class="fa"><button class="btn">Guardar reparación</button></div></div></form>`)}if(type==='product'){return openModal('Nuevo producto',`<form class="form" onsubmit="addProduct(event)"><div class="f"><label>SKU</label><input name="sku" required></div><div class="f"><label>Producto</label><input name="name" required></div><div class="f"><label>Categoría</label><input name="category" required></div><div class="f"><label>Costo</label><input name="cost" type="number" step=".01" min="0" required></div><div class="f"><label>Precio</label><input name="price" type="number" step=".01" min="0" required></div><div class="f"><label>Stock</label><input name="stock" type="number" min="0" value="0" required></div><div class="f"><label>Stock mínimo</label><input name="minStock" type="number" min="0" value="${db.settings.lowStock}" required></div><div class="f full"><div class="fa"><button class="btn">Guardar</button></div></div></form>`)}if(type==='stock'){if(!db.products.length)return alert('No hay productos.');return openModal('Entrada / ajuste',`<form class="form" onsubmit="addStock(event)"><div class="f full"><label>Producto</label><select name="productId">${db.products.map(p=>`<option value="${p.id}">${p.name} · stock ${p.stock}</option>`).join('')}</select></div><div class="f"><label>Tipo</label><select name="mode"><option value="add">Sumar unidades</option><option value="set">Fijar stock exacto</option></select></div><div class="f"><label>Cantidad</label><input name="qty" type="number" min="0" required></div><div class="f full"><div class="fa"><button class="btn">Aplicar</button></div></div></form>`)}if(type==='expense'){return openModal('Nuevo gasto',`<form class="form" onsubmit="addExpense(event)"><div class="f"><label>Fecha</label><input name="date" type="date" value="${today}" required></div><div class="f"><label>Categoría</label><select name="category"><option>Energía</option><option>Internet</option><option>Publicidad</option><option>Transporte</option><option>Herramientas</option><option>Materiales</option><option>Otros</option></select></div><div class="f full"><label>Descripción</label><input name="description" required></div><div class="f"><label>Monto</label><input name="amount" type="number" step=".01" min="0" required></div><div class="f"><label>Pago</label><select name="payment">${payOptions()}</select></div><div class="f"><label>Registró</label><select name="by">${staffOptions()}</select></div><div class="f full"><div class="fa"><button class="btn">Guardar gasto</button></div></div></form>`)}}
function fd(e){e.preventDefault();return new FormData(e.target)}function ensureCash(method,date){if(method==='Efectivo'&&date===today){const c=currentCash();if(!c||c.status!=='open'){alert('Primero abre la caja para registrar efectivo de hoy.');return false}}return true}
function addOpenCash(e){const f=fd(e);db.cashSessions.push({id:uid('c'),date:today,opening:n(f.get('opening')),openedBy:f.get('by'),status:'open',openedAt:now()});save();closeModal()}
function addCloseCash(e){const f=fd(e),c=currentCash();c.expectedAtClose=cashExpected();c.closing=n(f.get('closing'));c.status='closed';c.closedAt=now();save();closeModal()}
function addSale(e){const f=fd(e),p=db.products.find(x=>x.id===f.get('productId')),q=n(f.get('qty')),date=f.get('date'),payment=f.get('payment');if(!p)return;if(p.stock<q)return alert('Stock insuficiente.');if(!ensureCash(payment,date))return;const price=n(f.get('price'));db.sales.push({id:uid('s'),date,client:f.get('client')||'Consumidor final',productId:p.id,qty:q,total:price*q,costTotal:p.cost*q,payment,seller:f.get('seller'),createdAt:now()});p.stock-=q;save();closeModal()}
function addRepair(e){const f=fd(e),date=f.get('date'),status=f.get('status'),paid=n(f.get('paid')),method=f.get('method');if(paid>0&&!ensureCash(method,date))return;const payments=paid>0?[{id:uid('p'),date,amount:paid,method,createdAt:now()}]:[];db.repairs.push({id:uid('r'),order:`ST-${today.replaceAll('-','')}-${String(db.repairs.length+1).padStart(3,'0')}`,date,client:f.get('client'),phone:f.get('phone'),device:f.get('device'),description:f.get('description'),tech:f.get('tech'),status,total:n(f.get('total')),partsCost:n(f.get('partsCost')),payments,doneDate:['Listo','Entregado'].includes(status)?date:null,createdAt:now()});save();closeModal()}
function changeRepairStatus(id,status){const r=db.repairs.find(x=>x.id===id);if(!r)return;r.status=status;r.doneDate=['Listo','Entregado'].includes(status)?(r.doneDate||today):null;save()}
function openRepair(id){const r=db.repairs.find(x=>x.id===id);if(!r)return;openModal(`Gestionar ${r.order}`,`<div class="grid g3">${kpi('Total',money.format(r.total),'Servicio')}${kpi('Pagado',money.format(repairPaid(r)),'Cobrado')}${kpi('Saldo',money.format(repairBalance(r)),'Pendiente')}</div>${section('Registrar abono','El pago entra a caja solo si es efectivo y la caja está abierta')}<form class="form" onsubmit="addRepairPayment(event,'${r.id}')"><div class="f"><label>Fecha</label><input name="date" type="date" value="${today}" required></div><div class="f"><label>Monto</label><input name="amount" type="number" step=".01" min="0.01" max="${Math.max(.01,repairBalance(r))}" required></div><div class="f"><label>Método</label><select name="method">${payOptions()}</select></div><div class="f full"><div class="fa"><button class="btn" ${repairBalance(r)<=0?'disabled':''}>Registrar abono</button></div></div></form>${section('Pagos','Historial de cobros')}${table(['Fecha','Monto','Método'],(r.payments||[]).map(p=>`<tr><td>${p.date}</td><td>${money.format(p.amount)}</td><td>${paymentBadge(p.method)}</td></tr>`))}`)}
function addRepairPayment(e,id){const f=fd(e),r=db.repairs.find(x=>x.id===id),date=f.get('date'),amount=n(f.get('amount')),method=f.get('method');if(amount>repairBalance(r))return alert('El abono supera el saldo.');if(!ensureCash(method,date))return;r.payments.push({id:uid('p'),date,amount,method,createdAt:now()});save();openRepair(id)}
function addProduct(e){const f=fd(e);db.products.push({id:uid('pr'),sku:f.get('sku'),name:f.get('name'),category:f.get('category'),cost:n(f.get('cost')),price:n(f.get('price')),stock:n(f.get('stock')),minStock:n(f.get('minStock')),createdAt:now()});save();closeModal()}
function addStock(e){const f=fd(e),p=db.products.find(x=>x.id===f.get('productId')),q=n(f.get('qty'));p.stock=f.get('mode')==='set'?q:p.stock+q;save();closeModal()}
function addExpense(e){const f=fd(e),date=f.get('date'),payment=f.get('payment');if(!ensureCash(payment,date))return;db.expenses.push({id:uid('e'),date,category:f.get('category'),description:f.get('description'),amount:n(f.get('amount')),payment,by:f.get('by'),createdAt:now()});save();closeModal()}
function saveSettings(e){const f=fd(e),p=n(f.get('producerPct')),b=n(f.get('businessPct'));if(p+b!==100)return alert('Los porcentajes deben sumar 100%.');db.settings={producerPct:p,businessPct:b,reservePct:n(f.get('reservePct')),lowStock:n(f.get('lowStock'))};save();alert('Configuración guardada.')}
function resetAll(){if(!confirm('Se borrarán ventas, reparaciones, inventario, gastos y cajas. ¿Continuar?'))return;db=structuredClone(seed);save();alert('Todo quedó en cero.')}
function exportData(){const a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download=`servi-tecno-${today}.json`;a.click();URL.revokeObjectURL(a.href)}
document.querySelector('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('Respaldo importado.')}catch{alert('Archivo inválido.')}};r.readAsText(f)};
save();
</script>
</body>
</html>
