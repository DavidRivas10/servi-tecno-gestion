<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Servi Tecno | Gestión</title><style>
:root{--bg:#f4f7fb;--p:#1565d8;--d:#0b1220;--tx:#0f172a;--m:#64748b;--ln:#e2e8f0;--g:#079669;--r:#dc2626;--w:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:linear-gradient(#0b1220,#111a2b);color:white;padding:22px 16px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;gap:10px;align-items:center;padding-bottom:18px;border-bottom:1px solid #ffffff18}.logo{width:42px;height:42px;border-radius:12px;background:#2677e8;display:grid;place-items:center;font-weight:900}.brand small{display:block;color:#9aa8bc}.nav{display:flex;flex-direction:column;gap:7px;flex:1}.nav button{border:0;background:transparent;color:#b2bfd0;text-align:left;padding:11px;border-radius:11px;font-weight:650}.nav button.active,.nav button:hover{background:#2a76e72b;color:white}.side .backup{border:1px solid #ffffff29;color:white;background:transparent;padding:9px;border-radius:10px}.main{padding:28px 32px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.top h1{margin:2px 0 0}.ey{font-size:11px;color:var(--p);font-weight:900;letter-spacing:.15em}.btn{border:0;background:var(--p);color:white;padding:10px 13px;border-radius:10px;font-weight:750;cursor:pointer}.btn2{border:0;background:#e7f0ff;color:var(--p);padding:10px 13px;border-radius:10px;font-weight:750;cursor:pointer}.view{display:none}.view.active{display:block}.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:white;border:1px solid var(--ln);border-radius:17px;padding:18px;box-shadow:0 10px 30px #0f172a0c}.k small{color:var(--m)}.k b{display:block;font-size:27px;margin:8px 0}.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 11px}.sec h2{font-size:18px;margin:0}.sec p{margin:3px 0;color:var(--m);font-size:13px}.tbl{overflow:auto;background:white;border:1px solid var(--ln);border-radius:15px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px 13px;border-bottom:1px solid var(--ln);text-align:left;font-size:13px}th{font-size:11px;text-transform:uppercase;color:#475569;background:#f8fafc}.good{color:var(--g);font-weight:800}.bad{color:var(--r);font-weight:800}.badge{padding:5px 8px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:11px;font-weight:800}.notice{padding:13px 15px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:13px;color:#1e3a8a;font-size:13px}.sum{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--ln)}.sum:last-child{border:0}.modalbg{position:fixed;inset:0;background:#02061799;display:none;place-items:center;padding:18px}.modalbg.open{display:grid}.modal{background:white;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:20px}.mh{display:flex;justify-content:space-between}.x{border:0;background:#eef2f7;border-radius:9px;width:34px;height:34px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.f{display:flex;flex-direction:column;gap:6px}.f.full{grid-column:1/-1}.f label{font-size:12px;font-weight:700;color:#475569}.f input,.f select{padding:10px;border:1px solid var(--ln);border-radius:9px}.fa{display:flex;justify-content:flex-end;gap:8px;margin-top:5px}.bars{height:210px;display:flex;align-items:end;gap:12px}.bw{flex:1;text-align:center;font-size:10px;color:var(--m)}.bar{background:linear-gradient(#4f95ff,#1c62c9);border-radius:7px 7px 2px 2px;min-height:4px}.muted{color:var(--m)}@media(max-width:1000px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.main{padding:18px 14px}.g4,.g3,.g2{grid-template-columns:1fr}.form{grid-template-columns:1fr}.f.full{grid-column:auto}.top{align-items:flex-start}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">ST</div><div><b>SERVI TECNO</b><small>Gestión integral</small></div></div><div class="nav" id="nav"></div><button class="backup" onclick="exportData()">Exportar respaldo</button></aside><main class="main"><div class="top"><div><div class="ey">SERVI TECNO</div><h1 id="title">Dashboard</h1></div><button class="btn" onclick="openForm('sale')">+ Registrar venta</button></div><div id="views"></div></main></div><div class="modalbg" id="mb"><div class="modal"><div class="mh"><div><div class="ey">SERVI TECNO</div><h2 id="mt"></h2></div><button class="x" onclick="closeM()">✕</button></div><div id="mc"></div></div></div><input type="file" id="imp" accept="application/json" hidden><script>
const K='servitecno_clean_v1',F=new Intl.NumberFormat('es-HN',{style:'currency',currency:'HNL'}),today=new Date().toISOString().slice(0,10);const seed={
settings:{prod:60,biz:40,allow:0,reserve:15,low:3},
partners:[
{id:'p1',name:'Socio comercial',role:'Ventas, compras y administración'},
{id:'p2',name:'Técnico celulares',role:'Reparación de teléfonos'},
{id:'p3',name:'Técnico PC e impresoras',role:'Computadoras e impresoras'}
],
products:[],
sales:[],
services:[],
expenses:[],
cash:[]
};let db=JSON.parse(localStorage.getItem(K)||JSON.stringify(seed));const save=()=>{localStorage.setItem(K,JSON.stringify(db));render()};const uid=p=>p+Math.random().toString(36).slice(2,8),pn=id=>db.partners.find(x=>x.id===id)?.name||'—',pr=id=>db.products.find(x=>x.id===id)?.name||'Producto';function week(d=today){let x=new Date(d+'T12:00');let n=x.getDay()||7;x.setDate(x.getDate()-n+1);let a=x.toISOString().slice(0,10);x.setDate(x.getDate()+6);return[a,x.toISOString().slice(0,10)]}const inR=(d,a,b)=>d>=a&&d<=b;function calc(a,b){let s=db.sales.filter(x=>inR(x.date,a,b)),r=db.services.filter(x=>inR(x.date,a,b)),e=db.expenses.filter(x=>inR(x.date,a,b)),sr=s.reduce((t,x)=>t+x.q*x.price,0),sc=s.reduce((t,x)=>t+x.q*x.cost,0),rr=r.reduce((t,x)=>t+x.amount,0),rc=r.reduce((t,x)=>t+x.parts,0),sm=sr-sc,rm=rr-rc,biz=(sm+rm)*db.settings.biz/100,ex=e.reduce((t,x)=>t+x.amount,0),allow=db.partners.length*db.settings.allow,after=biz-ex-allow,res=Math.max(0,after)*db.settings.reserve/100;return{s,r,e,sr,sc,rr,rc,sm,rm,biz,ex,allow,after,res,ret:after-res}}function prod(a,b){let o=Object.fromEntries(db.partners.map(p=>[p.id,0])),q=db.settings.prod/100;db.sales.filter(x=>inR(x.date,a,b)).forEach(x=>o[x.seller]+=(x.price-x.cost)*x.q*q);db.services.filter(x=>inR(x.date,a,b)).forEach(x=>o[x.tech]+=(x.amount-x.parts)*q);return o}const k=(l,v,h='')=>`<div class="card k"><small>${l}</small><b>${v}</b><span class="muted">${h}</span></div>`,sec=(t,d,b='')=>`<div class="sec"><div><h2>${t}</h2><p>${d}</p></div>${b}</div>`,tbl=(h,rows)=>`<div class="tbl"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;const pages=['dashboard','sales','services','inventory','expenses','cash','reports','partners','settings'],names={dashboard:'Dashboard',sales:'Ventas',services:'Reparaciones',inventory:'Inventario',expenses:'Gastos',cash:'Caja y capital',reports:'Reportes',partners:'Socios',settings:'Configuración'};document.querySelector('#nav').innerHTML=pages.map((p,i)=>`<button class="${i?'':'active'}" onclick="go('${p}',this)">${names[p]}</button>`).join('');document.querySelector('#views').innerHTML=pages.map((p,i)=>`<section id="${p}" class="view ${i?'':'active'}"></section>`).join('');function go(p,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelector('#'+p).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#title').textContent=names[p]}
function render(){let [a,b]=week(),r=calc(a,b),pp=prod(a,b),invCost=db.products.reduce((t,x)=>t+x.cost*x.stock,0),low=db.products.filter(x=>x.stock<=db.settings.low).length;document.querySelector('#dashboard').innerHTML=`<div class="grid g4" style="margin-top:24px">${k('Ingresos semana',F.format(r.sr+r.rr),'Ventas + servicios')}${k('Margen producido',F.format(r.sm+r.rm),'Después de costos')}${k('Fondo Servi Tecno',F.format(r.biz),'Parte del negocio')}${k('Inventario a costo',F.format(invCost),low+' productos con stock bajo')}</div>${sec('Producción por socio',a+' al '+b)}<div class="grid g3">${db.partners.map(p=>`<div class="card"><b>${p.name}</b><div class="muted">${p.role}</div><h2>${F.format(pp[p.id]||0)}</h2><small>Producción personal semanal</small></div>`).join('')}</div>`;document.querySelector('#sales').innerHTML=sec('Ventas','Productos y accesorios',`<button class="btn" onclick="openForm('sale')">+ Venta</button>`)+tbl(['Fecha','Producto','Cant.','Venta','Margen','Vendedor'],db.sales.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${pr(x.pid)}</td><td>${x.q}</td><td>${F.format(x.q*x.price)}</td><td class="good">${F.format((x.price-x.cost)*x.q)}</td><td>${pn(x.seller)}</td></tr>`));document.querySelector('#services').innerHTML=sec('Reparaciones','Trabajos técnicos',`<button class="btn" onclick="openForm('service')">+ Reparación</button>`)+tbl(['Fecha','Cliente','Área','Trabajo','Cobrado','Repuestos','Técnico','Estado'],db.services.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.client}</td><td>${x.cat}</td><td>${x.desc}</td><td>${F.format(x.amount)}</td><td>${F.format(x.parts)}</td><td>${pn(x.tech)}</td><td><span class="badge">${x.status}</span></td></tr>`));document.querySelector('#inventory').innerHTML=`<div class="grid g3" style="margin-top:24px">${k('Valor a costo',F.format(invCost),'Capital en inventario')}${k('Valor a venta',F.format(db.products.reduce((t,x)=>t+x.price*x.stock,0)),'Potencial bruto')}${k('Stock bajo',low,'Reponer pronto')}</div>${sec('Inventario','Costo, precio, stock y dueño del capital',`<button class="btn" onclick="openForm('product')">+ Producto</button>`)}${tbl(['SKU','Producto','Categoría','Costo','Precio','Stock','Capital de'],db.products.map(x=>`<tr><td>${x.sku}</td><td>${x.name}</td><td>${x.cat}</td><td>${F.format(x.cost)}</td><td>${F.format(x.price)}</td><td>${x.stock}</td><td>${pn(x.owner)}</td></tr>`))}`;document.querySelector('#expenses').innerHTML=sec('Gastos','Operación, publicidad, servicios y herramientas',`<button class="btn" onclick="openForm('expense')">+ Gasto</button>`)+tbl(['Fecha','Categoría','Descripción','Monto'],db.expenses.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.cat}</td><td>${x.desc}</td><td class="bad">${F.format(x.amount)}</td></tr>`));document.querySelector('#cash').innerHTML=sec('Caja y capital','Aportes y retiros extraordinarios',`<button class="btn" onclick="openForm('cash')">+ Movimiento</button>`)+tbl(['Fecha','Tipo','Descripción','Monto'],db.cash.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.type}</td><td>${x.desc}</td><td>${F.format(x.amount)}</td></tr>`))+`<div class="notice" style="margin-top:15px">El costo del inventario se conserva como capital. El reparto ${db.settings.prod}/${db.settings.biz} se aplica únicamente al margen.</div>`;document.querySelector('#reports').innerHTML=`${sec('Reporte semanal',a+' al '+b,`<button class="btn2" onclick="print()">Imprimir / PDF</button>`)}<div class="grid g4">${k('Ingresos',F.format(r.sr+r.rr))}${k('Margen',F.format(r.sm+r.rm))}${k('Fondo generado',F.format(r.biz))}${k('Gastos',F.format(r.ex))}</div><div class="grid g2" style="margin-top:15px"><div class="card"><h3>Liquidación socios</h3>${db.partners.map(p=>`<div class="sum"><span>${p.name}<br><small class="muted">Producción ${F.format(pp[p.id]||0)} + asignación ${F.format(db.settings.allow)}</small></span><b>${F.format((pp[p.id]||0)+db.settings.allow)}</b></div>`).join('')}</div><div class="card"><h3>Fondo de crecimiento</h3><div class="sum"><span>Parte negocio</span><b>${F.format(r.biz)}</b></div><div class="sum"><span>− Gastos</span><b>${F.format(r.ex)}</b></div><div class="sum"><span>− Asignaciones</span><b>${F.format(r.allow)}</b></div><div class="sum"><span>Reserva ${db.settings.reserve}%</span><b>${F.format(r.res)}</b></div><div class="sum"><span>Disponible para crecer</span><b>${F.format(r.ret)}</b></div></div></div>`;document.querySelector('#partners').innerHTML=sec('Socios','Roles y producción')+`<div class="grid g3">${db.partners.map(p=>`<div class="card"><b>${p.name}</b><p class="muted">${p.role}</p><h2>${F.format(pp[p.id]||0)}</h2><small>Esta semana</small></div>`).join('')}</div>`;document.querySelector('#settings').innerHTML=sec('Configuración financiera','Cambia el modelo sin editar código')+`<div class="card"><form class="form" onsubmit="settings(event)"><div class="f"><label>% productor</label><input name="prod" type="number" value="${db.settings.prod}"></div><div class="f"><label>% Servi Tecno</label><input name="biz" type="number" value="${db.settings.biz}"></div><div class="f"><label>Asignación semanal por socio</label><input name="allow" type="number" value="${db.settings.allow}"></div><div class="f"><label>% reserva crecimiento</label><input name="reserve" type="number" value="${db.settings.reserve}"></div><div class="f"><label>Stock mínimo</label><input name="low" type="number" value="${db.settings.low}"></div><div class="f full"><div class="fa"><button type="button" class="btn2" onclick="document.querySelector('#imp').click()">Importar respaldo</button><button class="btn">Guardar</button></div></div></form></div>`}
function closeM(){document.querySelector('#mb').classList.remove('open')}function openForm(t){let title='',html='',P=db.partners.map(x=>`<option value="${x.id}">${x.name}</option>`).join(''),PR=db.products.map(x=>`<option value="${x.id}">${x.name} · stock ${x.stock}</option>`).join('');if(t==='sale'){if(!db.products.length){alert('Primero registra al menos un producto en Inventario.');closeM();return}title='Registrar venta';html=`<form class="form" onsubmit="addSale(event)"><div class="f"><label>Fecha</label><input name="date" type="date" value="${today}"></div><div class="f"><label>Producto</label><select name="pid">${PR}</select></div><div class="f"><label>Cantidad</label><input name="q" type="number" min="1" value="1"></div><div class="f"><label>Vendedor</label><select name="seller">${P}</select></div><div class="f full"><div class="fa"><button class="btn">Guardar venta</button></div></div></form>`}if(t==='service'){title='Nueva reparación';html=`<form class="form" onsubmit="addService(event)"><div class="f"><label>Fecha</label><input name="date" type="date" value="${today}"></div><div class="f"><label>Cliente</label><input name="client"></div><div class="f"><label>Área</label><select name="cat"><option>Celulares</option><option>Computadoras</option><option>Impresoras</option><option>Otro</option></select></div><div class="f"><label>Técnico</label><select name="tech">${P}</select></div><div class="f full"><label>Trabajo</label><input name="desc"></div><div class="f"><label>Total cobrado</label><input name="amount" type="number"></div><div class="f"><label>Repuestos</label><input name="parts" type="number" value="0"></div><div class="f"><label>Estado</label><select name="status"><option>Recibido</option><option>En proceso</option><option>Listo</option><option selected>Entregado</option></select></div><div class="f full"><div class="fa"><button class="btn">Guardar</button></div></div></form>`}if(t==='product'){title='Nuevo producto';html=`<form class="form" onsubmit="addProduct(event)"><div class="f"><label>SKU</label><input name="sku"></div><div class="f"><label>Producto</label><input name="name"></div><div class="f"><label>Categoría</label><input name="cat"></div><div class="f"><label>Dueño capital</label><select name="owner">${P}</select></div><div class="f"><label>Costo</label><input name="cost" type="number"></div><div class="f"><label>Precio</label><input name="price" type="number"></div><div class="f"><label>Stock</label><input name="stock" type="number" value="1"></div><div class="f full"><div class="fa"><button class="btn">Guardar</button></div></div></form>`}if(t==='expense'){title='Registrar gasto';html=`<form class="form" onsubmit="addExpense(event)"><div class="f"><label>Fecha</label><input name="date" type="date" value="${today}"></div><div class="f"><label>Categoría</label><input name="cat"></div><div class="f full"><label>Descripción</label><input name="desc"></div><div class="f"><label>Monto</label><input name="amount" type="number"></div><div class="f full"><div class="fa"><button class="btn">Guardar</button></div></div></form>`}if(t==='cash'){title='Movimiento de capital';html=`<form class="form" onsubmit="addCash(event)"><div class="f"><label>Fecha</label><input name="date" type="date" value="${today}"></div><div class="f"><label>Tipo</label><select name="type"><option>Aporte</option><option>Retiro</option></select></div><div class="f full"><label>Descripción</label><input name="desc"></div><div class="f"><label>Monto</label><input name="amount" type="number"></div><div class="f full"><div class="fa"><button type="button" class="btn2" onclick="resetZero()">Dejar todo en cero</button><button class="btn">Guardar</button></div></div></form>`}document.querySelector('#mt').textContent=title;document.querySelector('#mc').innerHTML=html;document.querySelector('#mb').classList.add('open')}
function fd(e){e.preventDefault();return new FormData(e.target)}function addSale(e){let f=fd(e),p=db.products.find(x=>x.id===f.get('pid')),q=+f.get('q');if(!p)return alert('Primero registra un producto en Inventario.');if(p.stock<q)return alert('Stock insuficiente');db.sales.push({id:uid('s'),date:f.get('date'),pid:p.id,q,price:p.price,cost:p.cost,seller:f.get('seller')});p.stock-=q;save();closeM()}function addService(e){let f=fd(e);db.services.push({id:uid('r'),date:f.get('date'),client:f.get('client'),cat:f.get('cat'),desc:f.get('desc'),tech:f.get('tech'),amount:+f.get('amount'),parts:+f.get('parts'),status:f.get('status')});save();closeM()}function addProduct(e){let f=fd(e);db.products.push({id:uid('p'),sku:f.get('sku'),name:f.get('name'),cat:f.get('cat'),cost:+f.get('cost'),price:+f.get('price'),stock:+f.get('stock'),owner:f.get('owner')});save();closeM()}function addExpense(e){let f=fd(e);db.expenses.push({id:uid('e'),date:f.get('date'),cat:f.get('cat'),desc:f.get('desc'),amount:+f.get('amount')});save();closeM()}function addCash(e){let f=fd(e);db.cash.push({id:uid('c'),date:f.get('date'),type:f.get('type'),desc:f.get('desc'),amount:+f.get('amount')});save();closeM()}function settings(e){let f=fd(e),p=+f.get('prod'),b=+f.get('biz');if(p+b!==100)return alert('Los porcentajes deben sumar 100');Object.assign(db.settings,{prod:p,biz:b,allow:+f.get('allow'),reserve:+f.get('reserve'),low:+f.get('low')});save();alert('Configuración guardada')}function resetZero(){if(!confirm('Esto eliminará ventas, reparaciones, inventario, gastos y movimientos de caja. ¿Continuar?'))return;db={settings:{...db.settings,allow:0},partners:db.partners,products:[],sales:[],services:[],expenses:[],cash:[]};save();alert('Servi Tecno quedó en cero.')}function exportData(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='servi-tecno-respaldo.json';a.click()}document.querySelector('#imp').onchange=e=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('Respaldo importado')}catch{alert('Archivo inválido')}};r.readAsText(e.target.files[0])};render();
</script></body></html>
