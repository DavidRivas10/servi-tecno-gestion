<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Servi Tecno | Gestión</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--p:#1565d8;--p2:#0b4ca8;--tx:#0f172a;--m:#64748b;--ln:#e2e8f0;--g:#059669;--y:#d97706;--r:#dc2626;--shadow:0 12px 32px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#0b1220,#111a2b);padding:22px 16px;color:#fff;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 18px;border-bottom:1px solid #ffffff18}
.logo{width:43px;height:43px;border-radius:12px;background:linear-gradient(135deg,#2b7fff,#155ec9);display:grid;place-items:center;font-weight:900}
.brand b{display:block;letter-spacing:.04em}.brand small{color:#98a6bc}
.nav{display:flex;flex-direction:column;gap:6px;flex:1;overflow:auto}
.nav button{border:0;background:transparent;color:#b8c4d5;text-align:left;padding:11px 12px;border-radius:11px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.nav button:hover,.nav button.active{background:#2a76e72b;color:#fff}.nav .left{display:flex;align-items:center;gap:9px}.nav .count{min-width:23px;height:23px;border-radius:999px;background:#ef4444;color:#fff;display:grid;place-items:center;font-size:11px}
.side-actions{display:grid;gap:8px}.side-btn{border:1px solid #ffffff24;background:transparent;color:#e5edf8;padding:9px 10px;border-radius:10px}
.main{padding:26px 30px 48px;min-width:0}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}
.ey{font-size:11px;color:var(--p);font-weight:900;letter-spacing:.15em}.top h1{margin:3px 0 0;font-size:29px;letter-spacing:-.03em}
.top-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.date{font-size:13px;color:var(--m);background:#fff;border:1px solid var(--ln);padding:10px 12px;border-radius:11px}
.btn,.btn2,.btn3,.danger{border:0;padding:10px 13px;border-radius:10px;font-weight:800}.btn{background:var(--p);color:#fff}.btn:hover{background:var(--p2)}.btn2{background:#eaf2ff;color:var(--p)}.btn3{background:#f1f5f9;color:#334155}.danger{background:#fee2e2;color:#b91c1c}
.view{display:none}.view.active{display:block}.grid{display:grid;gap:14px}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--ln);border-radius:17px;padding:18px;box-shadow:var(--shadow)}.k small{color:var(--m);font-size:12px}.k b{display:block;font-size:25px;margin:8px 0 5px;letter-spacing:-.03em}.k .sub{font-size:12px;color:var(--m)}
.sec{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 10px}.sec h2{font-size:18px;margin:0}.sec p{font-size:13px;color:var(--m);margin:3px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}
.notice{padding:13px 15px;border-radius:13px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;font-size:13px}.notice.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}.notice.good{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.tbl{overflow:auto;background:#fff;border:1px solid var(--ln);border-radius:15px;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px 12px;border-bottom:1px solid var(--ln);text-align:left;font-size:12.5px;vertical-align:middle}th{background:#f8fafc;color:#475569;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}tr:last-child td{border-bottom:0}
.muted{color:var(--m)}.goodtxt{color:var(--g);font-weight:800}.badtxt{color:var(--r);font-weight:800}.warntxt{color:var(--y);font-weight:800}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;font-size:10.5px;font-weight:800;white-space:nowrap}.b-blue{background:#dbeafe;color:#1d4ed8}.b-green{background:#dcfce7;color:#047857}.b-yellow{background:#fef3c7;color:#a16207}.b-red{background:#fee2e2;color:#b91c1c}.b-purple{background:#ede9fe;color:#6d28d9}.b-gray{background:#e2e8f0;color:#475569}
.status-select{border:1px solid var(--ln);background:#fff;padding:7px 8px;border-radius:9px;font-size:11px;max-width:170px}.alert-list{display:flex;flex-direction:column;gap:9px}.alert-item{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:#fff}.alert-item strong{font-size:13px}.alert-item small{display:block;margin-top:3px;color:var(--m)}
.cash-hero{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.cash-state{display:flex;justify-content:space-between;gap:15px;align-items:center}.state-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px}.state-open{background:#10b981}.state-closed{background:#94a3b8}
.sum{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--ln)}.sum:last-child{border:0}.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.person{display:flex;gap:12px;align-items:flex-start}.avatar{width:45px;height:45px;border-radius:13px;background:#eaf2ff;color:var(--p);display:grid;place-items:center;font-weight:900;flex:0 0 auto}
.modalbg{position:fixed;inset:0;background:#020617a6;display:none;place-items:center;padding:18px;z-index:100}.modalbg.open{display:grid}.modal{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:19px;padding:21px;box-shadow:0 30px 90px #0004}.mh{display:flex;justify-content:space-between;gap:15px}.mh h2{margin:4px 0 17px}.x{border:0;background:#eef2f7;width:35px;height:35px;border-radius:10px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.f{display:flex;flex-direction:column;gap:6px}.f.full{grid-column:1/-1}.f label{font-size:12px;color:#475569;font-weight:750}.f input,.f select,.f textarea{border:1px solid var(--ln);padding:10px 11px;border-radius:9px;outline:none;background:#fff}.f input:focus,.f select:focus,.f textarea:focus{border-color:#78aaff;box-shadow:0 0 0 3px #2b7fff18}.f textarea{min-height:82px;resize:vertical}.fa{display:flex;justify-content:flex-end;gap:8px;margin-top:5px}.empty{padding:30px;text-align:center;color:var(--m)}
.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid var(--ln);background:#fff;color:#475569;padding:8px 11px;border-radius:9px;font-weight:750}.tab.active{background:#eaf2ff;color:var(--p);border-color:#cfe0ff}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mini{font-size:12px;padding:8px 0;border-bottom:1px dashed var(--ln)}.mini:last-child{border-bottom:0}.right{text-align:right}
@media(max-width:1250px){.g6{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.nav{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible}.side-actions{grid-template-columns:1fr 1fr}.main{padding:20px 15px 40px}.cash-hero,.people,.g3,.g2,.split{grid-template-columns:1fr}.top{flex-direction:column}.g6,.g5,.g4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.nav{grid-template-columns:repeat(2,1fr)}.g6,.g5,.g4{grid-template-columns:1fr}.form{grid-template-columns:1fr}.f.full{grid-column:auto}.date{display:none}}@media print{.side,.top-actions,.actions{display:none!important}.app{display:block}.main{padding:0}.view{display:none!important}#reports.view.active{display:block!important}.card,.tbl{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">ST</div><div><b>SERVI TECNO</b><small>Control operativo</small></div></div>
    <div class="nav" id="nav"></div>
    <div class="side-actions"><button class="side-btn" onclick="exportData()">Exportar respaldo</button><button class="side-btn" onclick="document.querySelector('#importFile').click()">Importar respaldo</button></div>
  </aside>
  <main class="main">
    <div class="top">
      <div><div class="ey">SERVI TECNO</div><h1 id="title">Dashboard</h1></div>
      <div class="top-actions"><div class="date" id="dateLabel"></div><button class="btn2" onclick="openForm('service')">+ Reparación</button><button class="btn" onclick="openForm('sale')">+ Venta</button></div>
    </div>
    <div id="views"></div>
  </main>
</div>
<div class="modalbg" id="modal"><div class="modal"><div class="mh"><div><div class="ey">SERVI TECNO</div><h2 id="modalTitle"></h2></div><button class="x" onclick="closeModal()">✕</button></div><div id="modalContent"></div></div></div>
<input type="file" id="importFile" accept="application/json" hidden>
<script>
const STORE='servitecno_v2';
const money=new Intl.NumberFormat('es-HN',{style:'currency',currency:'HNL',maximumFractionDigits:2});
const num=n=>Number(n||0);
const localISO=(d=new Date())=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
const today=localISO();
const now=()=>new Date().toISOString();
const uid=p=>p+Math.random().toString(36).slice(2,9);
const seed={version:3,settings:{producerPct:60,businessPct:40,reservePct:15,lowStock:3,weeklyAllowance:0},staff:[
{id:'david',name:'David',role:'Ventas de teléfonos, computadoras, accesorios y administración',type:'sales'},
{id:'roberto',name:'Roberto',role:'Técnico de teléfonos',type:'technician'},
{id:'tico',name:'Tico',role:'Técnico de teléfonos',type:'technician'}
],products:[],sales:[],repairs:[],expenses:[],capital:[],cashSessions:[]};

function migrate(data){
  const d=data&&typeof data==='object'?data:structuredClone(seed);
  d.version=3;
  d.settings={...seed.settings,...(d.settings||{})};
  d.staff=Array.isArray(d.staff)&&d.staff.length?d.staff:structuredClone(seed.staff);
  d.products=Array.isArray(d.products)?d.products:[];
  d.sales=Array.isArray(d.sales)?d.sales:[];
  d.expenses=Array.isArray(d.expenses)?d.expenses:[];
  d.capital=Array.isArray(d.capital)?d.capital:[];
  d.cashSessions=Array.isArray(d.cashSessions)?d.cashSessions:[];
  d.repairs=Array.isArray(d.repairs)?d.repairs:[];
  d.repairs.forEach(r=>{
    r.total=num(r.total);r.partsCost=num(r.partsCost);r.history=Array.isArray(r.history)?r.history:[];
    if(!Array.isArray(r.payments)){
      r.payments=[];
      if(num(r.paid)>0)r.payments.push({id:uid('pay'),date:r.date,amount:num(r.paid),method:r.payment||'Efectivo',by:'david',createdAt:r.createdAt||now(),note:'Pago migrado'});
    }
    r.paid=r.payments.reduce((t,p)=>t+num(p.amount),0);
    if(!r.completionDate&&['Listo para entrega','Entregado'].includes(r.status))r.completionDate=r.date;
    if(['Cancelado'].includes(r.status))r.completionDate=null;
  });
  return d;
}
function loadDB(){try{return migrate(JSON.parse(localStorage.getItem(STORE))||structuredClone(seed))}catch{return structuredClone(seed)}}
let db=loadDB();
function save(){db=migrate(db);localStorage.setItem(STORE,JSON.stringify(db));render()}
const staffName=id=>db.staff.find(x=>x.id===id)?.name||'—';
const productName=id=>db.products.find(x=>x.id===id)?.name||'Producto';
const inRange=(d,a,b)=>!!d&&d>=a&&d<=b;
const dateText=d=>{try{return new Intl.DateTimeFormat('es-HN',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(d+'T12:00:00'))}catch{return d}};
function weekRange(d=today){let x=new Date(d+'T12:00:00'),day=x.getDay()||7;x.setDate(x.getDate()-day+1);let a=localISO(x);x.setDate(x.getDate()+6);return[a,localISO(x)]}
function monthRange(d=today){let x=new Date(d+'T12:00:00');return[`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-01`,`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(new Date(x.getFullYear(),x.getMonth()+1,0).getDate()).padStart(2,'0')}`]}
function repairPaid(r){return (r.payments||[]).reduce((t,p)=>t+num(p.amount),0)}
function repairBalance(r){return Math.max(0,num(r.total)-repairPaid(r))}
function completed(r){return ['Listo para entrega','Entregado'].includes(r.status)&&!!r.completionDate}
function repairPaymentsInRange(a,b){return db.repairs.flatMap(r=>(r.payments||[]).filter(p=>inRange(p.date,a,b)).map(p=>({...p,repairId:r.id,tech:r.tech,partsCost:r.partsCost,total:r.total,status:r.status})))}

const pages=[['dashboard','⌂','Dashboard'],['cash','◉','Caja diaria'],['sales','◫','Ventas'],['repairs','🛠','Reparaciones'],['inventory','▦','Inventario'],['expenses','↘','Gastos'],['capital','₤','Capital y fondos'],['reports','▥','Reportes'],['staff','♟','Equipo'],['settings','⚙','Configuración']];
document.querySelector('#views').innerHTML=pages.map((p,i)=>`<section id="${p[0]}" class="view ${i?'':'active'}"></section>`).join('');
function navRender(){const alerts=getAlerts();document.querySelector('#nav').innerHTML=pages.map(p=>`<button class="${document.querySelector('#'+p[0])?.classList.contains('active')?'active':''}" onclick="go('${p[0]}',this)"><span class="left"><span>${p[1]}</span>${p[2]}</span>${p[0]==='repairs'&&alerts.length?`<span class="count">${alerts.length}</span>`:''}</button>`).join('')}
function go(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelector('#'+id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');document.querySelector('#title').textContent=pages.find(x=>x[0]===id)?.[2]||'Servi Tecno';render()}
document.querySelector('#dateLabel').textContent=new Intl.DateTimeFormat('es-HN',{dateStyle:'full'}).format(new Date());

function badgeStatus(s){const map={'Recibido':'b-blue','Diagnóstico':'b-purple','Esperando autorización':'b-yellow','Esperando repuesto':'b-yellow','En reparación':'b-blue','Listo para entrega':'b-green','Entregado':'b-gray','Cancelado':'b-red'};return `<span class="badge ${map[s]||'b-gray'}">${s}</span>`}
const paymentBadge=p=>`<span class="badge ${p==='Efectivo'?'b-green':p==='Transferencia'?'b-blue':'b-gray'}">${p}</span>`;
const kpi=(label,value,sub='')=>`<div class="card k"><small>${label}</small><b>${value}</b><div class="sub">${sub}</div></div>`;
const section=(title,desc,buttons='')=>`<div class="sec"><div><h2>${title}</h2><p>${desc}</p></div><div class="actions">${buttons}</div></div>`;
function table(headers,rows){if(!rows.length)return `<div class="card empty">Sin registros todavía.</div>`;return `<div class="tbl"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}

function currentCash(date=today){return db.cashSessions.find(x=>x.date===date)||null}
function dayCashExpected(date=today){
  const session=currentCash(date);if(!session)return 0;
  const cashSales=db.sales.filter(x=>x.date===date&&x.payment==='Efectivo').reduce((t,x)=>t+num(x.total),0);
  const cashRepairPayments=repairPaymentsInRange(date,date).filter(x=>x.method==='Efectivo').reduce((t,x)=>t+num(x.amount),0);
  const cashExpenses=db.expenses.filter(x=>x.date===date&&x.payment==='Efectivo').reduce((t,x)=>t+num(x.amount),0);
  const cashCapital=db.capital.filter(x=>x.date===date&&x.payment==='Efectivo').reduce((t,x)=>t+(x.type==='Aporte'?num(x.amount):-num(x.amount)),0);
  return num(session.opening)+cashSales+cashRepairPayments+cashCapital-cashExpenses;
}

function financials(a,b){
  const sales=db.sales.filter(x=>inRange(x.date,a,b));
  const completedRepairs=db.repairs.filter(r=>completed(r)&&inRange(r.completionDate,a,b));
  const payments=repairPaymentsInRange(a,b);
  const expenses=db.expenses.filter(x=>inRange(x.date,a,b));
  const salesRevenue=sales.reduce((t,x)=>t+num(x.total),0);
  const salesCost=sales.reduce((t,x)=>t+num(x.costTotal),0);
  const salesMargin=salesRevenue-salesCost;
  const serviceProduced=completedRepairs.reduce((t,r)=>t+num(r.total),0);
  const serviceParts=completedRepairs.reduce((t,r)=>t+num(r.partsCost),0);
  const serviceMargin=completedRepairs.reduce((t,r)=>t+Math.max(0,num(r.total)-num(r.partsCost)),0);
  const repairCollections=payments.reduce((t,p)=>t+num(p.amount),0);
  const receivables=completedRepairs.reduce((t,r)=>t+repairBalance(r),0);
  const margin=salesMargin+serviceMargin;
  const businessGross=margin*db.settings.businessPct/100;
  const expenseTotal=expenses.reduce((t,x)=>t+num(x.amount),0);
  const allowances=db.staff.length*num(db.settings.weeklyAllowance);
  const after=businessGross-expenseTotal-allowances;
  const reserve=Math.max(0,after)*db.settings.reservePct/100;
  const retained=after-reserve;
  return{sales,completedRepairs,payments,expenses,salesRevenue,salesCost,salesMargin,serviceProduced,serviceParts,serviceMargin,repairCollections,receivables,margin,businessGross,expenseTotal,allowances,reserve,retained};
}
function productionByStaff(a,b){
  const generated=Object.fromEntries(db.staff.map(x=>[x.id,0])),available=Object.fromEntries(db.staff.map(x=>[x.id,0])),pct=db.settings.producerPct/100;
  db.sales.filter(x=>inRange(x.date,a,b)).forEach(x=>{const m=Math.max(0,num(x.total)-num(x.costTotal))*pct;generated[x.seller]=(generated[x.seller]||0)+m;available[x.seller]=(available[x.seller]||0)+m});
  db.repairs.filter(r=>completed(r)&&inRange(r.completionDate,a,b)).forEach(r=>generated[r.tech]=(generated[r.tech]||0)+Math.max(0,num(r.total)-num(r.partsCost))*pct);
  db.repairs.forEach(r=>{
    if(!completed(r))return;
    const paidInPeriod=(r.payments||[]).filter(p=>inRange(p.date,a,b)).reduce((t,p)=>t+num(p.amount),0);
    if(paidInPeriod<=0)return;
    const paidLifetime=repairPaid(r);
    const recoveredMarginLifetime=Math.max(0,paidLifetime-num(r.partsCost));
    const previousPaid=Math.max(0,paidLifetime-paidInPeriod);
    const previousRecoveredMargin=Math.max(0,previousPaid-num(r.partsCost));
    const newMarginCollected=Math.max(0,recoveredMarginLifetime-previousRecoveredMargin);
    available[r.tech]=(available[r.tech]||0)+newMarginCollected*pct;
  });
  return{generated,available};
}
function globalReceivables(){return db.repairs.filter(r=>completed(r)&&r.status!=='Cancelado').reduce((t,r)=>t+repairBalance(r),0)}

function getAlerts(){
  const alerts=[];
  db.repairs.forEach(r=>{
    if(r.status==='Listo para entrega')alerts.push({type:'ready',title:`${r.order} listo para entregar`,sub:`${r.client} · ${r.device}`});
    if(r.status==='Esperando autorización')alerts.push({type:'warn',title:`${r.order} espera autorización`,sub:`${r.client} · ${r.device}`});
    if(r.status==='Esperando repuesto')alerts.push({type:'warn',title:`${r.order} espera repuesto`,sub:`${r.client} · ${r.device}`});
    const days=Math.floor((new Date(today+'T12:00:00')-new Date(r.date+'T12:00:00'))/86400000);
    if(!['Entregado','Cancelado'].includes(r.status)&&days>=3)alerts.push({type:'late',title:`${r.order} lleva ${days} días abierto`,sub:`${r.client} · ${r.status}`});
    if(completed(r)&&repairBalance(r)>0)alerts.push({type:'pay',title:`${r.order} tiene saldo pendiente`,sub:`Saldo ${money.format(repairBalance(r))}`});
  });
  db.products.filter(p=>p.stock<=num(p.minStock??db.settings.lowStock)).forEach(p=>alerts.push({type:'stock',title:`Stock bajo: ${p.name}`,sub:`Quedan ${p.stock} unidades`}));
  const c=currentCash();if(!c)alerts.unshift({type:'cash',title:'Caja de hoy sin abrir',sub:'Abre caja antes de iniciar operaciones'});
  return alerts;
}
function repairCounter(){const prefix=today.replaceAll('-',''),n=db.repairs.filter(x=>x.date===today).length+1;return `ST-${prefix}-${String(n).padStart(3,'0')}`}

function renderDashboard(){
  const day=financials(today,today),alerts=getAlerts(),cash=currentCash(),openRep=db.repairs.filter(x=>!['Entregado','Cancelado'].includes(x.status)).length,ready=db.repairs.filter(x=>x.status==='Listo para entrega').length,prod=productionByStaff(today,today);
  document.querySelector('#dashboard').innerHTML=`<div class="grid g6">
    ${kpi('Ventas de hoy',money.format(day.salesRevenue),`${day.sales.length} ventas`)}
    ${kpi('Servicios completados',money.format(day.serviceProduced),`${day.completedRepairs.length} reparaciones terminadas`)}
    ${kpi('Cobrado reparaciones',money.format(day.repairCollections),`${day.payments.length} pagos/abonos`)}
    ${kpi('Cuentas por cobrar',money.format(globalReceivables()),'Saldo pendiente total')}
    ${kpi('Gastos de hoy',money.format(day.expenseTotal),'Operación diaria')}
    ${kpi('Caja',cash?(cash.status==='open'?'ABIERTA':'CERRADA'):'SIN ABRIR',cash?`Esperado ${money.format(dayCashExpected())}`:'Requiere apertura')}
  </div>
  <div class="grid g2" style="margin-top:14px">

  const paid=repairPaid(r),balance=repairBalance(r);
  openModal(`Gestionar ${r.order}`,`<div class="grid g3">${kpi('Total',money.format(r.total),'Valor acordado')}${kpi('Pagado',money.format(paid),'Pagos registrados')}${kpi('Saldo',money.format(balance),balance?'Pendiente':'Pagado')}</div>
  <div class="split" style="margin-top:14px">
    <div class="card"><h3>Datos de la orden</h3><form class="form" onsubmit="editRepair(event,'${r.id}')"><div class="f"><label>Cliente</label><input name="client" value="${escapeHtml(r.client)}" required></div><div class="f"><label>Contacto</label><input name="phone" value="${escapeHtml(r.phone||'')}"></div><div class="f"><label>Equipo</label><input name="device" value="${escapeHtml(r.device)}" required></div><div class="f"><label>Técnico</label><select name="tech">${staffOptions('technician',r.tech)}</select></div><div class="f full"><label>Falla / trabajo</label><textarea name="description">${escapeHtml(r.description)}</textarea></div><div class="f"><label>Total acordado</label><input name="total" type="number" step=".01" min="0" value="${r.total}"></div><div class="f"><label>Costo repuestos</label><input name="partsCost" type="number" step=".01" min="0" value="${r.partsCost}"></div><div class="f full"><div class="fa"><button class="btn2">Guardar datos</button></div></div></form></div>
    <div class="card"><h3>Registrar pago / abono</h3><form class="form" onsubmit="addRepairPayment(event,'${r.id}')"><div class="f"><label>Fecha</label><input name="date" type="date" value="${today}" required></div><div class="f"><label>Monto</label><input name="amount" type="number" step=".01" min="0.01" max="${Math.max(balance,0.01)}" required></div><div class="f"><label>Forma de pago</label><select name="method">${payOptions()}</select></div><div class="f"><label>Registró</label><select name="by">${staffOptions()}</select></div><div class="f full"><label>Nota</label><input name="note" placeholder="Opcional"></div><div class="f full"><div class="fa"><button class="btn" ${balance<=0?'disabled':''}>Registrar abono</button></div></div></form></div>
  </div>
  ${section('Historial de pagos','Cada abono conserva fecha, método y responsable')}
  ${table(['Fecha','Monto','Método','Registró','Nota'],(r.payments||[]).slice().reverse().map(p=>`<tr><td>${p.date}</td><td><b>${money.format(p.amount)}</b></td><td>${paymentBadge(p.method)}</td><td>${staffName(p.by)}</td><td>${p.note||'—'}</td></tr>`))}
  ${section('Historial de estados','Trazabilidad de la orden')}
  ${table(['Fecha / hora','Estado'],(r.history||[]).slice().reverse().map(h=>`<tr><td>${new Date(h.at).toLocaleString('es-HN')}</td><td>${badgeStatus(h.status)}</td></tr>`))}`);
}
function escapeHtml(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function formData(e){e.preventDefault();return new FormData(e.target)}
function requireOpenCashForCashMovement(payment,date){if(payment==='Efectivo'&&date===today){const c=currentCash();if(!c||c.status!=='open'){alert('Para registrar movimientos en efectivo de hoy, primero abre la caja diaria.');return false}}return true}
function saleProductChanged(id){const p=db.products.find(x=>x.id===id);if(p)document.querySelector('#salePrice').value=p.price}
function addOpenCash(e){const f=formData(e);db.cashSessions.push({id:uid('cs'),date:today,opening:num(f.get('opening')),openedBy:f.get('by'),openedAt:now(),status:'open',closing:null,expectedAtClose:null,note:''});save();closeModal()}
function addCloseCash(e){const f=formData(e),c=currentCash(),expected=dayCashExpected(today);c.closing=num(f.get('closing'));c.expectedAtClose=expected;c.note=f.get('note');c.closedAt=now();c.status='closed';save();closeModal()}
function addSale(e){const f=formData(e),p=db.products.find(x=>x.id===f.get('productId')),qty=num(f.get('qty')),payment=f.get('payment'),date=f.get('date');if(!p)return alert('Producto no encontrado.');if(p.stock<qty)return alert('Stock insuficiente.');if(!requireOpenCashForCashMovement(payment,date))return;const price=num(f.get('price'));db.sales.push({id:uid('s'),date,client:f.get('client')||'Consumidor final',productId:p.id,qty,unitPrice:price,total:price*qty,costTotal:p.cost*qty,payment,seller:f.get('seller'),createdAt:now()});p.stock-=qty;save();closeModal()}
function addRepair(e){
  const f=formData(e),date=f.get('date'),status=f.get('status'),initial=num(f.get('initialPayment')),method=f.get('paymentMethod');
  if(initial>0&&!requireOpenCashForCashMovement(method,date))return;
  const payments=initial>0?[{id:uid('pay'),date,amount:initial,method,by:'david',createdAt:now(),note:'Abono inicial'}]:[];
  db.repairs.push({id:uid('r'),order:repairCounter(),date,client:f.get('client'),phone:f.get('phone'),category:f.get('category'),device:f.get('device'),description:f.get('description'),tech:f.get('tech'),status,total:num(f.get('total')),partsCost:num(f.get('partsCost')),payments,paid:initial,completionDate:['Listo para entrega','Entregado'].includes(status)?date:null,createdAt:now(),updatedAt:now(),history:[{status,at:now()}]});
  save();closeModal();
}
function changeRepairStatus(id,status){
  const r=db.repairs.find(x=>x.id===id);if(!r)return;
  r.status=status;r.updatedAt=now();r.history=r.history||[];r.history.push({status,at:now()});
  if(['Listo para entrega','Entregado'].includes(status)){if(!r.completionDate)r.completionDate=today}else r.completionDate=null;
  save();
}
function editRepair(e,id){const f=formData(e),r=db.repairs.find(x=>x.id===id);if(!r)return;r.client=f.get('client');r.phone=f.get('phone');r.device=f.get('device');r.tech=f.get('tech');r.description=f.get('description');r.total=num(f.get('total'));r.partsCost=num(f.get('partsCost'));r.updatedAt=now();save();openRepair(id)}
function addRepairPayment(e,id){
  const f=formData(e),r=db.repairs.find(x=>x.id===id);if(!r)return;
  const date=f.get('date'),amount=num(f.get('amount')),method=f.get('method');
  if(amount<=0)return alert('El monto debe ser mayor que cero.');
  if(amount>repairBalance(r)+0.001)return alert('El abono no puede superar el saldo pendiente.');
  if(!requireOpenCashForCashMovement(method,date))return;
  r.payments=r.payments||[];r.payments.push({id:uid('pay'),date,amount,method,by:f.get('by'),note:f.get('note'),createdAt:now()});r.paid=repairPaid(r);r.updatedAt=now();save();openRepair(id);
}
function addProduct(e){const f=formData(e);db.products.push({id:uid('p'),sku:f.get('sku'),name:f.get('name'),category:f.get('category'),owner:f.get('owner'),cost:num(f.get('cost')),price:num(f.get('price')),stock:num(f.get('stock')),minStock:num(f.get('minStock')),createdAt:now()});save();closeModal()}
function addStock(e){const f=formData(e),p=db.products.find(x=>x.id===f.get('productId')),q=num(f.get('qty'));if(!p)return;p.stock=f.get('movement')==='set'?q:p.stock+q;save();closeModal()}
function addExpense(e){const f=formData(e),payment=f.get('payment'),date=f.get('date');if(!requireOpenCashForCashMovement(payment,date))return;db.expenses.push({id:uid('e'),date,category:f.get('category'),description:f.get('description'),amount:num(f.get('amount')),payment,by:f.get('by'),createdAt:now()});save();closeModal()}
function addCapital(e){const f=formData(e),payment=f.get('payment'),date=f.get('date');if(!requireOpenCashForCashMovement(payment,date))return;db.capital.push({id:uid('c'),date,type:f.get('type'),description:f.get('description'),amount:num(f.get('amount')),payment,by:f.get('by'),createdAt:now()});save();closeModal()}
function saveSettings(e){const f=formData(e),p=num(f.get('producerPct')),b=num(f.get('businessPct'));if(p+b!==100)return alert('Productor + Servi Tecno deben sumar exactamente 100%.');db.settings={...db.settings,producerPct:p,businessPct:b,reservePct:num(f.get('reservePct')),weeklyAllowance:num(f.get('weeklyAllowance')),lowStock:num(f.get('lowStock'))};save();alert('Configuración guardada')}
function resetSystem(){if(!confirm('Esto borrará todos los movimientos y dejará el sistema desde cero. ¿Continuar?'))return;db=structuredClone(seed);save();alert('Sistema reiniciado.')}
function exportData(){const a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download=`servi-tecno-respaldo-${today}.json`;a.click();URL.revokeObjectURL(a.href)}
document.querySelector('#importFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{db=migrate(JSON.parse(r.result));save();alert('Respaldo importado correctamente.')}catch{alert('El archivo no corresponde a un respaldo válido.')}};r.readAsText(file)};
save();
</script>
</body>
</html>
